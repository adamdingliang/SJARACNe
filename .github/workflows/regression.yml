name: Small workflow regression

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Small regression (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
          - python-version: '3.14'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: '0'
    steps:
      - name: Set evidence locations
        run: |
          printf 'REGRESSION_OUTPUT=%s/sjaracne-regression-py%s-%s-%s\n' "$RUNNER_TEMP" '${{ matrix.python-version }}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'BOOTSTRAP_OUTPUT=%s/sjaracne-bootstrap-py%s-%s-%s\n' "$RUNNER_TEMP" '${{ matrix.python-version }}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'UV_PROJECT_ENVIRONMENT=%s/sjaracne-env-py%s\n' "$RUNNER_TEMP" '${{ matrix.python-version }}' >> "$GITHUB_ENV"
          printf 'UV_CACHE_DIR=%s/sjaracne-uv-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.16'
          enable-cache: false

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++ make nodejs bats

      - name: Install locked regression environment and this checkout
        run: |
          mkdir -p "$BOOTSTRAP_OUTPUT"
          make -C SJARACNe
          uv sync --locked --python '${{ matrix.python-version }}' --group regression --extra cwl
          uv export --locked --group regression --extra cwl --no-emit-project --no-hashes --output-file "$BOOTSTRAP_OUTPUT/locked-requirements.txt"
          uv run --locked --no-sync python -m pip check
          uv run --locked --no-sync python -m pip freeze --all > "$BOOTSTRAP_OUTPUT/pip-freeze.txt"
          uv run --locked --no-sync python --version > "$BOOTSTRAP_OUTPUT/python-version.txt"
          uv --version > "$BOOTSTRAP_OUTPUT/uv-version.txt"
          sha256sum uv.lock pyproject.toml > "$BOOTSTRAP_OUTPUT/dependency-inputs.sha256"
          printf '%s\n' "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"
          g++ --version > "$BOOTSTRAP_OUTPUT/compiler-version.txt"
          node --version > "$BOOTSTRAP_OUTPUT/node-version.txt"
          bats --version > "$BOOTSTRAP_OUTPUT/bats-version.txt"

      - name: Verify fresh installation from the source archive
        run: >-
          uv run --locked --no-sync python tests/check_source_install.py
          --output-dir "$BOOTSTRAP_OUTPUT/source-install"
          --requirements "$BOOTSTRAP_OUTPUT/locked-requirements.txt"
          --build-requirements "$BOOTSTRAP_OUTPUT/locked-requirements.txt"

      - name: Verify uv offline installation and native cache invalidation
        run: >-
          uv run --locked --no-sync python tests/check_uv_install.py
          --uv "$(command -v uv)"
          --python "$UV_PROJECT_ENVIRONMENT/bin/python"
          --cache-dir "$RUNNER_TEMP/uv-install-cache-py${{ matrix.python-version }}"
          --output-dir "$BOOTSTRAP_OUTPUT/uv-install"

      - name: Install pinned Sprocket for WDL 1.3 regression
        run: |
          SPROCKET_DIR="$RUNNER_TEMP/sprocket-0.32.0"
          mkdir -p "$SPROCKET_DIR"
          curl --fail --location --retry 3 \
            --output "$SPROCKET_DIR/sprocket.tar.gz" \
            https://github.com/stjude-rust-labs/sprocket/releases/download/v0.32.0/sprocket-v0.32.0-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            27dbf45e3ceaad9e13d416fdf44e8741af1a98c6a516723b27057e695cab0756 \
            "$SPROCKET_DIR/sprocket.tar.gz" | sha256sum --check --strict
          tar -xzf "$SPROCKET_DIR/sprocket.tar.gz" -C "$SPROCKET_DIR" sprocket
          chmod +x "$SPROCKET_DIR/sprocket"
          printf '%s\n' "$SPROCKET_DIR" >> "$GITHUB_PATH"
          "$SPROCKET_DIR/sprocket" --version > "$BOOTSTRAP_OUTPUT/sprocket-version.txt"

      - name: Run complete small regression
        timeout-minutes: 15
        run: uv run --locked --no-sync python tests/run_regression.py --jobs 4 --output-dir "$REGRESSION_OUTPUT"

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: small-regression-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.REGRESSION_OUTPUT }}
            ${{ env.BOOTSTRAP_OUTPUT }}
          retention-days: 7
          if-no-files-found: warn
